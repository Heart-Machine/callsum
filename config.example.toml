# Конфигурация callsum. Все пути — относительно корня проекта либо абсолютные.

[paths]
# Папка, куда OBS пишет записи (её же слушает `callsum watch`).
recordings = "recordings"
# Папка с результатами: транскрипт, саммари, субтитры.
out = "out"
# Шаблон имени папки для одного созвона внутри out.
# Подстановки: {name} — имя файла записи без расширения, {date} — ГГГГ-ММ-ДД,
# {time} — ЧЧ-ММ-СС, {datetime} — дата и время. Например: "{date} {time} клиент".
folder_template = "{name}"

[audio]
# Расширения файлов, которые считаем записями созвонов.
extensions = [".mkv", ".mp4", ".mka", ".m4a", ".mp3", ".wav", ".flac", ".opus", ".webm"]
# Файл считается «дописанным», когда его размер не менялся столько секунд.
stable_seconds = 20

[transcribe]
model = "large-v3"
# cuda | cpu | auto
device = "auto"
# float16 для GPU, int8 для CPU. "auto" подберёт сам.
compute_type = "auto"
language = "ru"
beam_size = 5
# Фильтр тишины (Silero VAD). Сильно ускоряет обработку пауз в созвоне.
vad = true
# Пауза внутри сегмента, по которой он режется на отдельные реплики, с.
split_gap = 1.5
# Куда кэшировать веса модели (пусто = стандартный кэш HuggingFace).
model_dir = ""

[speakers]
# Соответствие «номер аудиодорожки OBS (с 1)» -> «имя говорящего».
# В OBS: дорожка 1 — микрофон, дорожка 2 — звук компьютера (см. README).
"1" = "Я"
"2" = "Собеседник"
# Имя для файлов с одной дорожкой (обычный mp3/m4a без разделения).
default = "Говорящий"
# Слить реплики одного говорящего, если пауза между ними меньше N секунд.
merge_gap = 2.0

[view]
# Чем открывать протоколы и расшифровки из окна приложения.
# Пусто — системная ассоциация .md (если её нет, Windows спросит «чем открыть»).
# Можно указать программу: "notepad++",
# путь к ней: 'C:\Program Files\Typora\Typora.exe' (одинарные кавычки — в двойных
#   обратный слеш пришлось бы удваивать),
# команду с подстановкой: "code -r {file}",
# или ссылку: "obsidian://open?path={file}".
markdown_app = ""

[obs]
# Профиль OBS и одноимённая коллекция сцен, созданные командой `callsum obs-setup`.
profile = "callsum"
# Шаблон имени файла записи — в синтаксисе OBS: %CCYY год, %MM месяц, %DD день,
# %hh часы, %mm минуты, %ss секунды. Применяется командой `callsum obs-setup`.
filename_format = "%CCYY-%MM-%DD %hh-%mm-%ss"
# Переключаться на них автоматически перед началом записи.
auto_switch = true
# После остановки вернуть тот профиль, что был до записи.
restore_after = true
# Хост websocket-сервера OBS. Порт и пароль берутся из настроек самого OBS;
# port = 0 означает «спросить у OBS», ненулевое значение перекрывает его.
host = "127.0.0.1"
port = 0

[summary]
enabled = true
host = "http://127.0.0.1:11434"
model = "qwen3:14b"
# Окно контекста. При 8192 модель qwen3:14b целиком помещается в 12 ГБ видеопамяти
# и считается только на видеокарте; при 16384 она занимает 12 ГБ, часть слоёв уходит
# на процессор, и протокол готовится примерно вдвое дольше. Если видеопамяти больше —
# поднимайте, тогда длинные созвоны пойдут меньшим числом проходов.
num_ctx = 8192
temperature = 0.2
# Отключить «размышления» qwen3 — быстрее и чище на выходе.
think = false
# Транскрипты длиннее N символов режутся на куски (map-reduce).
# Размер куска подобран под num_ctx: в окно должны поместиться и кусок, и ответ.
chunk_chars = 12000
chunk_overlap_chars = 1500
timeout_seconds = 1800
