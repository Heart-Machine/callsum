name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  tests:
    # Windows намеренно: приложение работает только на нём, а тесты разбирают
    # пути Windows и реестр — на Linux они проверяли бы не то.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Установка зависимостей
        # Только то, что нужно тестам: faster-whisper с библиотеками CUDA весит
        # гигабайты, а в тестах не участвует — модель распознавания подменена.
        # tqdm ставится отдельно: он крошечный, а на нём держится полоса
        # скачивания модели, и проверять её надо.
        run: pip install pytest PySide6-Essentials websocket-client tqdm

      - name: Тесты
        run: python -m pytest tests -q

  app:
    # Приложение и клиент OBS на C#. Отдельная работа, чтобы падение одной
    # части было видно сразу, а не пряталось за другой.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "9.0.x"

      - name: Тесты
        # Только проект тестов: приложение WinUI тянет Windows App SDK
        # на сотни мегабайт, а проверять в нём пока нечего — разметка
        # и связка с OBS проверяются на живой машине.
        run: |
          dotnet test app/Callsum.Obs.Tests/Callsum.Obs.Tests.csproj --nologo -v q
          dotnet test app/Callsum.Core.Tests/Callsum.Core.Tests.csproj --nologo -v q
